<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Easy Tracking for Iran Post">
  <meta name="theme-color" content="#0f0f0f">
  <title>PostChi</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-2: #242424;
      --border: #2e2e2e;
      --yellow: #facc15;
      --yellow-dark: #eab308;
      --text: #f5f5f5;
      --text-muted: #a3a3a3;
      --danger: #f87171;
    }

    body {
      font-family: 'Estedad', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .app-header {
      padding: 28px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title .icon-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      display: block;
    }

    .app-title .icon-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .total-badge {
      border-radius: 14px;
      padding: 0 16px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .total-badge .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--yellow);
      display: block;
      line-height: 1.2;
    }

    .total-badge .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quick-add-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 14px;
      background: var(--yellow);
      color: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .quick-add-btn .material-icons-round {
      font-size: 24px;
    }

    .quick-add-btn:hover { background: var(--yellow-dark); }
    .quick-add-btn:active { transform: scale(0.92); }

    .content-section {
      padding: 0 20px 40px;
      margin-top: 20px;
    }

    .add-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .material-icons-round {
      font-size: 22px;
      color: var(--yellow);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Estedad', sans-serif;
      font-size: 0.95rem;
      background: var(--surface-2);
      color: var(--text);
      transition: border-color 0.2s;
      font-weight: 500;
    }

    /* فلش سفارشی برای select — رفع مشکل فلش پیش‌فرض */
    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a3a3a3'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: left 14px center;
      background-size: 20px;
      padding-left: 44px;
      cursor: pointer;
    }

    select option {
      background: var(--surface-2);
      color: var(--text);
    }

    input::placeholder {
      color: #6b6b6b;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .btn-add {
      width: 100%;
      background: var(--yellow);
      color: #0f0f0f;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-family: 'Estedad', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-add:hover { background: var(--yellow-dark); }
    .btn-add:active { transform: scale(0.98); }

    .parcel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .parcel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .parcel-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .parcel-company {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--yellow);
      background: rgba(250, 204, 21, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .parcel-code {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
      display: block;
      text-align: center;
      direction: ltr;
    }

    .parcel-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Estedad', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-track {
      background: var(--yellow);
      color: #0f0f0f;
    }

    .btn-track:hover { background: var(--yellow-dark); }

    .btn-copy {
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .btn-copy:hover { background: var(--border); }

    .btn-delete {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
    }

    .btn-delete:hover { background: rgba(248, 113, 113, 0.2); }

    .material-icons-round { font-size: 18px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #525252;
    }

    .empty-state .material-icons-round {
      font-size: 72px;
      opacity: 0.4;
      margin-bottom: 12px;
    }

    .empty-state-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--yellow);
      color: #0f0f0f;
      padding: 13px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 22px;
      max-height: 88vh;
      overflow-y: auto;
      transform: translateY(24px);
      transition: transform 0.25s;
    }

    .modal-overlay.show .modal-sheet {
      transform: translateY(0);
    }

    @media (min-width: 540px) {
      .modal-overlay {
        align-items: center;
      }

      .modal-sheet {
        border-radius: 24px;
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-close:hover { background: var(--border); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <div class="app-title">
        <span class="icon-badge"><img src="./icon.png" alt="PostChi"></span>
        پست‌چی
      </div>
      <div class="header-actions">
        <div class="total-badge">
          <span class="stat-value" id="totalCount">0</span>
          <span class="stat-label">مرسوله</span>
        </div>
        <button type="button" class="quick-add-btn" id="quickAddBtn" aria-label="Add parcel">
          <span class="material-icons-round">add</span>
        </button>
      </div>
    </div>

    <div class="content-section">
      <div class="parcels-section">
        <div class="section-title">
          <span class="material-icons-round">inventory_2</span>
          مرسوله‌های من
        </div>
        <div id="parcelsList"></div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-header">
        <div class="section-title" style="margin-bottom:0;">
          <span class="material-icons-round">add_circle</span>
          افزودن مرسوله جدید
        </div>
        <button type="button" class="modal-close" id="modalCloseBtn" aria-label="Close">
          <span class="material-icons-round">close</span>
        </button>
      </div>
      <form id="parcelForm">
        <div class="form-group">
          <label for="parcelTitle">عنوان مرسوله</label>
          <input type="text" id="parcelTitle" placeholder="مثلاً: کتاب از دیجی‌کالا" required>
        </div>
        <div class="form-group">
          <label for="trackingCode">کد رهگیری</label>
          <input type="text" id="trackingCode" placeholder="کد رهگیری را وارد کنید" required>
        </div>
        <div class="form-group">
          <label for="company">شرکت پستی</label>
          <select id="company" required>
            <option value="">انتخاب کنید</option>
            <option value="post">پست ایران</option>
            <option value="tipax">تیپاکس</option>
            <option value="postex">پستکس</option>
            <option value="chapar">چاپار</option>
            <option value="alopeyk">الوپیک</option>
            <option value="miare">میاره</option>
            <option value="snappbox">اسنپ باکس</option>
            <option value="mahex">ماهکس</option>
          </select>
        </div>
        <button type="submit" class="btn-add">
          <span class="material-icons-round">add</span>
          افزودن مرسوله
        </button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast">
    <span class="material-icons-round">check_circle</span>
    <span id="toastText"></span>
  </div>

  <script>
    const companies = {
      post:     { name: 'پست ایران',  url: code => `https://tracking.post.ir/?id=${code}` },
      tipax:    { name: 'تیپاکس',     url: code => `https://tipaxco.com/tracking/${code}` },
      postex:   { name: 'پستکس',      url: code => `https://postex.ir/tracking/${code}` },
      chapar:   { name: 'چاپار',      url: code => `https://chaparapp.ir/panel/track/${code}` },
      alopeyk:  { name: 'الوپیک',     url: code => `https://alopeyk.com/tracking?code=${code}` },
      miare:    { name: 'میاره',      url: code => `https://miare.ir/tracking/${code}` },
      snappbox: { name: 'اسنپ باکس',  url: code => `https://tracking.snapp-box.com/?code=${code}` },
      mahex:    { name: 'ماهکس',      url: code => `https://mahex.com/track/${code}` }
    };

    let parcels = JSON.parse(localStorage.getItem('parcels') || '[]');

    const form = document.getElementById('parcelForm');
    const listEl = document.getElementById('parcelsList');
    const totalEl = document.getElementById('totalCount');
    const toastEl = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    function save() {
      localStorage.setItem('parcels', JSON.stringify(parcels));
    }

    function showToast(msg) {
      toastText.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      totalEl.textContent = parcels.length;

      if (parcels.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <span class="material-icons-round">inbox</span>
            <div class="empty-state-text">هنوز مرسوله‌ای اضافه نکردی</div>
            <button type="button" class="btn-add" style="margin-top:18px;" onclick="document.getElementById('quickAddBtn').click()">
              <span class="material-icons-round">add</span>
              افزودن مرسوله
            </button>
          </div>`;
        return;
      }

      listEl.innerHTML = parcels.map(p => `
        <div class="parcel-card">
          <div class="parcel-header">
            <div class="parcel-title">${escapeHtml(p.title)}</div>
            <div class="parcel-company">${companies[p.company].name}</div>
          </div>
          <span class="parcel-code">${escapeHtml(p.code)}</span>
          <div class="parcel-actions">
            <button class="btn-action btn-track" onclick="trackParcel('${p.id}')">
              <span class="material-icons-round">open_in_new</span>
              پیگیری
            </button>
            <button class="btn-action btn-copy" onclick="copyCode('${p.id}')">
              <span class="material-icons-round">content_copy</span>
              کپی کد
            </button>
            <button class="btn-action btn-delete" onclick="deleteParcel('${p.id}')">
              <span class="material-icons-round">delete</span>
              حذف
            </button>
          </div>
        </div>`).join('');
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      parcels.unshift({
        id: Date.now().toString(),
        title: document.getElementById('parcelTitle').value.trim(),
        code: document.getElementById('trackingCode').value.trim(),
        company: document.getElementById('company').value
      });
      save();
      render();
      form.reset();
      closeModal();
      showToast('مرسوله اضافه شد');
    });

    function trackParcel(id) {
      const p = parcels.find(x => x.id === id);
      if (p) window.open(companies[p.company].url(p.code), '_blank');
    }

    function copyCode(id) {
      const p = parcels.find(x => x.id === id);
      if (p) {
        navigator.clipboard.writeText(p.code)
          .then(() => showToast('کد رهگیری کپی شد'))
          .catch(() => showToast('خطا در کپی کردن'));
      }
    }

    function deleteParcel(id) {
      if (confirm('این مرسوله حذف بشه؟')) {
        parcels = parcels.filter(x => x.id !== id);
        save();
        render();
        showToast('مرسوله حذف شد');
      }
    }

    const modalOverlay = document.getElementById('modalOverlay');

    function openModal() {
      modalOverlay.classList.add('show');
      document.body.style.overflow = 'hidden';
      setTimeout(() => document.getElementById('parcelTitle').focus(), 200);
    }

    function closeModal() {
      modalOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    document.getElementById('quickAddBtn').addEventListener('click', openModal);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => {
      if (e.target === modalOverlay) closeModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && modalOverlay.classList.contains('show')) closeModal();
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    render();
  </script>
</body>
</html>
