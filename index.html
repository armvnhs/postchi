<html lang="fa" dir="rtl">
<head>

<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Estedad', sans-serif;
  }
  
  body {
    background: #fafafa;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* Header */
  header {
    background: #fff;
    padding: 20px;
    border-bottom: 1px solid #e0e0e0;
  }
  
  .header-content {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .header-icon {
    font-size: 32px;
    color: #1976d2;
  }
  
  header h1 {
    font-size: 1.4rem;
    font-weight: 500;
    color: #212121;
  }

  /* Container */
  .container {
    max-width: 640px;
    margin: 24px auto;
    padding: 0 20px;
  }

  /* Stats */
  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .stat {
    flex: 1;
    background: #fff;
    padding: 16px;
    border-radius: 8px;
    border: 1px solid #e0e0e0;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stat-icon {
    font-size: 28px;
    color: #757575;
  }

  .stat-content {
    flex: 1;
  }

  .stat-number {
    font-size: 1.5rem;
    font-weight: 500;
    color: #212121;
    line-height: 1;
  }

  .stat-label {
    font-size: .8rem;
    color: #757575;
    margin-top: 4px;
  }

  /* Card */
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid #e0e0e0;
  }

  .card-title {
    font-size: 1rem;
    font-weight: 500;
    color: #212121;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .card-title .material-icons {
    font-size: 20px;
    color: #757575;
  }

  /* Form */
  .form-group {
    margin-bottom: 20px;
  }
  
  label {
    display: block;
    font-size: .85rem;
    font-weight: 400;
    color: #616161;
    margin-bottom: 8px;
  }

  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
    font-size: .95rem;
    transition: all .2s;
    background: #fff;
    font-family: 'Estedad', sans-serif;
    color: #212121;
  }
  
  input:focus, select:focus {
    outline: none;
    border-color: #1976d2;
  }

  select {
    cursor: pointer;
  }

  /* Button */
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 4px;
    font-size: .9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
    font-family: 'Estedad', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-primary {
    background: #1976d2;
    color: #fff;
  }

  .btn-primary:hover {
    background: #1565c0;
  }

  .btn-primary:active {
    transform: scale(.98);
  }

  .btn .material-icons {
    font-size: 18px;
  }

  /* Items List */
  .items-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .item {
    background: #fafafa;
    border-radius: 4px;
    padding: 16px;
    border: 1px solid #e0e0e0;
    transition: all .2s;
  }

  .item:hover {
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }

  .item-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .item-icon {
    color: #757575;
    font-size: 20px;
    margin-top: 2px;
  }

  .item-content {
    flex: 1;
    min-width: 0;
  }
