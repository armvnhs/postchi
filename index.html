<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="پیگیری آسان مرسوله‌های پستی ایران">
  <meta name="theme-color" content="#0f0f0f">
  <title>پست‌چی - پیگیری مرسوله</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-2: #242424;
      --border: #2e2e2e;
      --yellow: #facc15;
      --yellow-dark: #eab308;
      --text: #f5f5f5;
      --text-muted: #a3a3a3;
      --danger: #f87171;
    }

    body {
      font-family: 'Estedad', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .app-header {
      padding: 28px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title .icon-badge {
      width: 44px;
      height: 44px;
      background: var(--yellow);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-title .icon-badge .material-icons-round {
      font-size: 26px;
      color: #0f0f0f;
    }

    .total-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 16px;
      text-align: center;
    }

    .total-badge .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--yellow);
      display: block;
      line-height: 1.2;
    }

    .total-badge .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .content-section {
      padding: 0 20px 40px;
    }

    .add-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .material-icons-round {
      font-size: 22px;
      color: var(--yellow);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Estedad', sans-serif;
      font-size: 0.95rem;
      background: var(--surface-2);
      color: var(--text);
      transition: border-color 0.2s;
      font-weight: 500;
    }

    /* فلش سفارشی برای select — رفع مشکل فلش پیش‌فرض */
    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a3a3a3'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: left 14px center;
      background-size: 20px;
      padding-left: 44px;
      cursor: pointer;
    }

    select option {
      background: var(--surface-2);
      color: var(--text);
    }

    input::placeholder {
      color: #6b6b6b;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .btn-add {
      width: 100%;
      background: var(--yellow);
      color: #0f0f0f;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-family: 'Estedad', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-add:hover { background: var(--yellow-dark); }
    .btn-add:active { transform: scale(0.98); }

    .parcel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .parcel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .parcel-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .parcel-company {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--yellow);
      background: rgba(250, 204, 21, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .parcel-code {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.5px;
      display: block;
      text-align: center;
      direction: ltr;
    }

    .parcel-actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-action {
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-family: 'Estedad', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-track {
      background: var(--yellow);
      color: #0f0f0f;
    }

    .btn-track:hover { background: var(--yellow-dark); }

    .btn-copy {
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .btn-copy:hover { background: var(--border); }

    .btn-delete {
      background: rgba(248, 113, 113, 0.1);
      color: var(--danger);
    }

    .btn-delete:hover { background: rgba(248, 113, 113, 0.2); }

    .material-icons-round { font-size: 18px; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #525252;
    }

    .empty-state .material-icons-round {
      font-size: 72px;
      opacity: 0.4;
      margin-bottom: 12px;
    }

    .empty-state-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--yellow);
      color: #0f0f0f;
      padding: 13px 22px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <div class="app-title">
        <span class="icon-badge"><span class="material-icons-round">local_shipping</span></span>
        پست‌چی
      </div>
      <div class="total-badge">
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">مرسوله</span>
      </div>
    </div>

    <div class="content-section">
      <div class="add-card">
        <div class="section-title">
          <span class="material-icons-round">add_circle</span>
          افزودن مرسوله جدید
        </div>
        <form id="parcelForm">
          <div class="form-group">
            <label for="parcelTitle">عنوان مرسوله</label>
            <input type="text" id="parcelTitle" placeholder="مثلاً: کتاب از دیجی‌کالا" required>
          </div>
          <div class="form-group">
            <label for="trackingCode">کد رهگیری</label>
            <input type="text" id="trackingCode" placeholder="کد رهگیری را وارد کنید" required>
          </div>
          <div class="form-group">
            <label for="company">شرکت پستی</label>
            <select id="company" required>
              <option value="">انتخاب کنید</option>
              <option value="post">پست ایران</option>
              <option value="tipax">تیپاکس</option>
              <option value="postex">پستکس</option>
              <option value="chapar">چاپار</option>
              <option value="alopeyk">الوپیک</option>
              <option value="miare">میاره</option>
              <option value="snappbox">اسنپ باکس</option>
              <option value="mahex">ماهکس</option>
            </select>
          </div>
          <button type="submit" class="btn-add">
            <span class="material-icons-round">add</span>
            افزودن مرسوله
          </button>
        </form>
      </div>

      <div class="parcels-section">
        <div class="section-title">
          <span class="material-icons-round">inventory_2</span>
          مرسوله‌های من
        </div>
        <div id="parcelsList"></div>
      </div>
    </div>
  </
